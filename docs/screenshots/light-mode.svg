  <!-- Main doc content -->
  <text x="510" y="185" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#212121">Introduction</text>
  <text x="510" y="210" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#444">This guide walks you through setting up the SDK and making</text>
  <text x="510" y="228" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#444">your first API call in under 5 minutes.</text>

  <!-- Code block -->
  <rect x="510" y="245" width="600" height="70" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="526" y="265" font-family="monospace" font-size="12" fill="#333">$ npm install @acme/sdk</text>
  <text x="526" y="283" font-family="monospace" font-size="12" fill="#333">$ export API_KEY="your_key_here"</text>
  <text x="526" y="301" font-family="monospace" font-size="12" fill="#333">$ node -e "require('@acme/sdk').ping()"</text>

  <text x="510" y="338" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#212121">Prerequisites</text>
  <text x="510" y="363" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#444">• Node.js 18+ or Python 3.9+</text>
  <text x="510" y="381" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#444">• An active API key (see account settings)</text>
  <text x="510" y="399" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#444">• Network access to api.acme.io</text>

